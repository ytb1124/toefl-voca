const RAW_TASKS = [{"source":"Screenshot 2026-09-15 at 23.18.49.png","template":"The evolution of the film industry has been shaped by major technological shifts, especially the move from silent films to movies with sound. In the silent era, filmmakers relied entirely on visual storytelling, using expressive acting and title cards to convey dialogue and emotion. The introd{uction|도입} of synchronized so{und|소리}—where au{dio|음성} was mat{ched|맞춰진} precisely wi{th|~와} the mov{ing|움직이는} image—all{owed|가능하게 했다} audiences t{o|~하도록} hear act{ors|배우들} speak f{or|~동안, ~에} the first time, transforming the cinematic experience. This breakthrough laid the foundation for later innovations like CGI and immersive sound design, expanding how stories could be told on screen."},{"source":"Screenshot 2026-09-15 at 23.19.21.png","template":"The extinction of the baiji dolphin, also known as the Yangtze River dolphin, serves as a stark reminder of the impact of human activities on freshwater ecosystems. Declared functi{onally|기능적으로} extinct i{n|~년에} 2006, t{he|그} baiji suff{ered|고통받았다} from hab{itat|서식지} loss a{nd|그리고} the eff{ects|영향} of poll{ution|오염}. Conservationists atte{mpted|시도했다} rescue miss{ions|작전들} and breeding programs, but these efforts were hindered by the dolphin's declining population and fragmented habitat. Studying the baiji’s extinction helps scientists develop strategies to protect other endangered freshwater species and highlights the need for sustainable practices."},{"source":"Screenshot 2026-09-15 at 23.15.36.png","template":"Mass extinctions have periodically reshaped the diversity of life on Earth, representing significant biological and ecological shifts. The most famous event, the Cretaceous-Paleogene extinction, occurred approximately 66 million years ago and led to the demise of the dinosaurs. Large-scale los{ses|손실들} of spe{cies|종들} are of{ten|흔히} caused b{y|~에 의해} catastrophic eve{nts|사건들} such a{s|~와 같은} volcanic erup{tions|분출들}, asteroid imp{acts|충돌들}, and cli{mate|기후} change. T{he|그} resulting damage to biodiversity disrupts ecosystems and alters evolutionary trajectories. Studying past extinctions provides insights into the resilience and adaptability of life, helping scientists predict and mitigate future biodiversity loss."},{"source":"Screenshot 2026-09-15 at 23.25.42.png","template":"Rain is a crucial part of Earth's ecosystem, supporting both plant growth and animal survival. As precip{itation|강수} falls fr{om|~로부터} the s{ky|하늘}, it reple{nishes|보충한다} water sou{rces|공급원들}, nourishes veget{ation|초목}, and sust{ains|유지한다} wildlife. Some reg{ions|지역들} receive abun{dant|풍부한} rainfall, wh{ile|반면에} others experience prolonged dry periods, affecting local environments. Excessive rain can lead to floods, creating hazards for communities and natural habitats. Despite occasional dangers, rainfall is essential for maintaining ecological balance, ensuring that plants and animals thrive in diverse climates around the world."},{"source":"Screenshot 2026-09-15 at 23.12.02.png","template":"Human cognition refers to the mental processes involved in acquiring, processing, storing, and using knowledge. These inc{lude|포함한다} the wa{ys|방식들} that peo{ple|사람들} interpret sensory sig{nals|신호들} (perception), h{ow|어떻게} we st{ore|저장하다} and retr{ieve|인출하다} information (mem{ory|기억}), how lang{uage|언어} is prod{uced|생성되는} (speech), and how humans analyze and solve problems. Researchers study cognitive functions to uncover how the brain processes information and how these processes influence behavior. Insights from cognitive science can improve educational methods and help develop interventions for cognitive disorders."},{"source":"Screenshot 2026-09-15 at 23.15.27.png","template":"Prehistoric art and religion provide invaluable insights into the spiritual life of early humans. Cave paintings and carvings often depict animals and symbolic figures, reflecting the beliefs and rituals of ancient communities. These artworks se{rve|역할을 하다} as a win{dow|창} into t{he|그} social struc{tures|구조들} and cult{ural|문화적인} practices o{f|~의} prehistoric ti{mes|시대}. By stud{ying|연구함} them, resea{rchers|연구자들} can bet{ter|더 잘} understand the evolution of human thought and spirituality. These early forms of art show that even long ago, people had deep feelings, ideas, and questions about life and the world around them."},{"source":"Screenshot 2026-09-15 at 23.11.43.png","template":"Learning the controlled use of fire was a key development in human history that greatly improved the early humans' ability to survive. Coo{king|요리하기} food, partic{ularly|특히} meat a{nd|그리고} tubers, ma{de|만들었다} digesting nutr{ients|영양소들} much eas{ier|더 쉬운}. Fire al{so|또한} provided war{mth|온기} in col{der|더 추운} climates, allo{wing|가능하게 하며} humans to expand their geographic range and survive in areas where they might not have otherwise. In addition, fire was used to harden wood for tools like spears and to shape stones for cutting and scraping, thus contributing to advances in toolmaking."},{"source":"Screenshot 2026-09-15 at 23.19.33.png","template":"In the realm of conservation ecology, the role of keystone species is profoundly significant. These species, although not necessarily abundant, exert a substantial influence on their ecosystems’ structure and functioning. Beavers, for example, transform landscapes by building dams that cre{ate|만들다} wetlands, habi{tats|서식지들} rich i{n|~이 풍부한} biodiversity a{nd|그리고} vital f{or|~에 중요한} water purifi{cation|정화} and fl{ood|홍수} control. Their rem{oval|제거} often trig{gers|유발한다} a cas{cade|연쇄} of ecological changes, potentially leading to the decline or transformation of the ecosystem. Consequently, conservation efforts frequently prioritize the protection of these pivotal organisms to maintain ecological balance."},{"source":"Screenshot 2026-09-15 at 23.17.22.png","template":"The Pinta Island tortoise, a subspecies of giant tortoise native to Ecuador's Galapagos Islands, became extinct with the death of the last known individual, Lonesome George, in 2012. Pinta tortoises were kn{own|알려진} for th{eir|그들의} domed she{lls|등껍질들} and lo{ng|긴} necks ada{pted|적응된} for fee{ding|먹이 섭취}; they pla{yed|수행했다} a cru{cial|매우 중요한} role i{n|~에서} shaping veget{ation|초목} by grazing on plants and dispersing seeds. The extinction of this subspecies highlights the impact of human activity on isolated ecosystems. Invasive species and habitat destruction were significant factors contributing to its decline."},{"source":"Screenshot 2026-09-15 at 23.17.37.png","template":"The Erie Canal, completed in 1825, is a historic waterway in the United States that linked the Atlantic Ocean to the Great Lakes. Its constr{uction|건설} was a remar{kable|놀라운} engineering fe{at|위업} and pion{eered|개척했다} many innov{ative|혁신적인} techniques. T{he|그} canal signif{icantly|상당히} reduced transpo{rtation|운송} costs a{nd|그리고} time fr{om|~로부터} New York City to the interior of the nation, propelling the city into a major commercial hub. The success of the Erie Canal inspired the building of other canals and infrastructure projects across the United States."},{"source":"Screenshot 2026-09-15 at 23.13.51.png","template":"Global temperatures and weather patterns are experiencing notable shifts, which scientific research strongly associates with human-related factors. Activities su{ch|~와 같은} as t{he|그} use o{f|~의} fossil fu{els|연료들}, changes i{n|~에서의} land u{se|사용}, and industrial produ{ction|생산} contribute t{o|~에} the accumu{lation|축적} of green{house|온실} gases in the atmosphere. These gases retain heat, gradually increasing the Earth's average temperature. If emissions continue at current levels, potential outcomes may include more frequent extreme weather events, rising sea levels, and disruptions to ecosystems. Experts emphasize that timely and coordinated efforts are essential to reduce risks and promote long-term environmental stability."},{"source":"Screenshot 2026-09-15 at 23.13.45.png","template":"Museums play a crucial role in preserving and showcasing art, history, and culture. They pro{vide|제공한다} a sp{ace|공간} where peo{ple|사람들} can eng{age|관여하다} with mult{iple|여러} forms o{f|~의} artistic expre{ssion|표현} and histo{rical|역사적인} artifacts. Ma{ny|많은} museums al{so|또한} offer educational programs and workshops, fostering a deeper understanding of the subjects they display. In addition, digital innovations have enabled museums to reach global audiences through virtual tours and online collections. The patronage of visual arts by individuals and organizations helps support artists and ensures the continued growth and diversity of the cultural landscape."},{"source":"Screenshot 2026-09-15 at 23.16.48.png","template":"The unusual properties of spider silk—a remarkable combination of strength and elasticity—have long attracted the attention of many. Spider si{lk|실} has a brea{king|끊어지는} point f{ar|훨씬} greater th{an|~보다} steel a{nd|그리고} may str{etch|늘어나다} its fu{ll|전체의} length bef{ore|~전에} breaking: a 0.01 centi{meter|센티미터} thread c{an|~할 수 있다} support eighty grams. Spider silk is also very durable, a feature well illustrated by the persistence of cobwebs. Throughout history, humans have adapted spider silk for many purposes. For a long period, thick webs were used in Europe as bandages."},{"source":"Screenshot 2026-09-15 at 23.11.55.png","template":"One of the topics psychologists investigate is our capacity to understand the mental states of others. This abi{lity|능력} is funda{mental|필수적인} for soc{ial|사회적인} interaction bec{ause|~이기 때문에} it ena{bles|가능하게 한다} us t{o|~하도록} predict a{nd|그리고} explain t{he|그} behavior o{f|~의} others. I{s|~인가} this skill innate or shaped by experience? Is understanding others’ mental states a matter of simulation (imagining ourselves in their place) or theory (applying a set of rules or concepts)? These inquiries contribute to broader discussions about human cognition."},{"source":"Screenshot 2026-09-15 at 23.18.02.png","template":"In recent years, conservation ecology has emerged as a crucial field, addressing the impacts of human activity on natural ecosystems. Ecologists are increasingly focused on unders{tanding|이해하기} how spe{cies|종들} interact bo{th|양쪽 모두} with ea{ch|각각의} other a{nd|그리고} with th{eir|그들의} environments. Su{ch|그러한} knowledge i{s|~이다} essential f{or|~에} developing strat{egies|전략들} that mitigate biodiversity loss and habitat degradation. The complexity of ecological networks means that conservation efforts require collaboration across disciplines to craft effective policies and practices that ensure the sustainability of our planetary resources."},{"source":"Screenshot 2026-09-15 at 23.16.13.png","template":"Deserts and extreme environments pose unique challenges for the organisms that inhabit them. These ar{eas|지역들} are charac{terized|특징지어진} by ha{rsh|혹독한} conditions su{ch|~와 같은} as int{ense|극심한} temperatures, sca{rce|부족한} water, a{nd|그리고} limited veget{ation|초목}. Specialized adapt{ations|적응 형질들} have evo{lved|진화했다} in both plants and animals to increase survival. Studying these traits provides insights into the resilience of life and helps in understanding how ecosystems function under stress. Desert cacti store water in specialized tissues, while fennec foxes have enlarged ears for heat dissipation."},{"source":"Screenshot 2026-09-15 at 23.14.17.png","template":"Rooted in both biology and chemistry, modern biochemistry has grown into a foundational science that explores the molecular basis of life. I{t|그것은} emerged fr{om|~로부터} early investi{gations|연구들} into nat{ural|자연적인} process li{ke|~와 같은} fermentation a{nd|그리고} digestion and n{ow|지금은} encompasses t{he|그} study o{f|~의} biomolecules su{ch|~와 같은} as proteins, carbohydrates, and nucleic acids. Biochemistry plays a vital role in diverse fields including agriculture, environmental science, and pharmacology, contributing to innovations in areas like crop improvement, pollution control, and drug design, for example. Its broad applications continue to shape our understanding of living systems and support solutions to global challenges."},{"source":"Screenshot 2026-09-15 at 23.11.27.png","template":"What are some foundational skills for academic success? Critical thin{king|사고} allows stud{ents|학생들} to appr{oach|접근하다} problems systema{tically|체계적으로}, analyze infor{mation|정보}, and ma{ke|만들다} connections bet{ween|~사이에} ideas. Al{so|또한} important a{re|~이다} soft skills li{ke|~와 같은} time management and social skills. Time management is helpful for balancing studies, extracurricular activities, and personal life in an efficient manner. Social skills are good predictors of academic success because those who communicate effectively can form positive relationships with their peers and professors."},{"source":"Screenshot 2026-09-15 at 23.20.05.png","template":"In philosophy of mind, questions about consciousness and self-awareness focus on mental capacities like thoughts, beliefs, and desires that shape behavior. Thinkers such as Descartes and Locke examined the nature of inner experience and recognized the limits of understanding other minds. Over ti{me|시간}, this philos{ophical|철학적인} idea w{as|~되었다} adopted b{y|~에 의해} cognitive scien{tists|과학자들} who be{gan|시작했다} studying h{ow|어떻게} we iden{tify|알아보다} and inte{rpret|해석하다} mental sta{tes|상태들} in ourselves and others. This shift enabled deeper insights into empathy, communication, and social understanding, offering a bridge between abstract thought and observable human behavior."},{"source":"Screenshot 2026-09-15 at 23.16.05.png","template":"Extinctions are a natural part of Earth's history, marking the end of species that die out and paving the way for new ones. These inci{dents|사건들} can b{e|~이다} caused b{y|~에 의해} varying fac{tors|요인들}, such a{s|~와 같은} environmental cha{nges|변화들}, habitat lo{ss|손실}, and catast{rophic|재앙적인} events. Stud{ying|연구하기} extinctions he{lps|돕는다} scientists understand biodiversity and the resilience of ecosystems. Notable extinctions, like the one that wiped out most of the dinosaurs, offer insights into how life on Earth can dramatically shift. Modern conservation efforts aim to prevent human-induced extinctions and preserve remaining species."},{"source":"Screenshot 2026-09-15 at 23.11.20.png","template":"The Odyssey is an ancient Greek epic poem that follows the hero, Odysseus, on his ten-year journey home after the Trojan War. It i{s|~이다} widely consi{dered|여겨지는} one o{f|~중의} the grea{test|가장 위대한} works i{n|~에서} the his{tory|역사} of Euro{pean|유럽의} literature. The Odyssey estab{lished|확립했다} many narr{ative|서사의} structures a{nd|그리고} archetypes—like the hero's journey—that continue to shape storytelling today. It also delves into timeless human experiences. Odysseus's longing to return home, for example, resonates with the universal desire for belonging and stability. He must adapt, disguise, and rediscover himself, reflecting the fluid nature of identity."},{"source":"Screenshot 2026-09-15 at 23.13.31.png","template":"The piano has a rich history that spans over 300 years, evolving from earlier keyboard instruments like the clavichord and harpsichord. The mod{ern|현대의} piano w{as|~되었다} invented aro{und|약} 1700 b{y|~에 의해} Bartolomeo Cristofori, w{ho|~한 사람} developed a n{ew|새로운} mechanism th{at|~하는} made i{t|그것을} possible f{or|~가} players t{o|~하도록} control the dynamics—soft and loud sounds—by varying the pressure on the keys. Later key improvements include the addition of a cast iron frame and felt-covered hammers, which allowed for greater volume and durability. These changes made the piano a central instrument in both classical and popular music."},{"source":"Screenshot 2026-09-15 at 23.10.49.png","template":"Aquariums provide an opportunity to observe a variety of fish and other aquatic organisms in a controlled environment. These facil{ities|시설들} carefully repli{cate|재현한다} natural habi{tats|서식지들}, allowing visi{tors|방문객들} to le{arn|배우다} about mar{ine|해양의} life with{out|~없이} venturing in{to|~안으로} the oc{ean|바다}. Exhibits of{ten|흔히}  at 23.18.24.png","template":"The human brain is an extraordinarily intricate organ, unrivaled in its complexity and function. Studying its anatomy reveals a remarkable internal architecture, composed of billions of neurons intricately interconnected by synapses. These neurons tran{smit|전달한다} electrical impu{lses|신호들}, facilitating t{he|그} brain's ro{le|역할} in enab{ling|가능하게 함} cognition, proce{ssing|처리함} information, regul{ating|조절함} essential bod{ily|신체의} functions, a{nd|그리고} facilitating emot{ions|감정들}. The reflective nature of studying the brain encourages careful consideration of how its structure impacts behavior and thought."},{"source":"Screenshot 2026-09-15 at 23.15.14.png","template":"Paleontology, the study of ancient life through fossils, provides valuable insights into Earth's biological history. Fossils, incl{uding|포함하여} bones and she{lls|껍데기들}, offer evid{ence|증거} of orga{nisms|생물들} that li{ved|살았다} millions o{f|~의} years a{go|전에}. By stud{ying|연구함} these rem{ains|유해들}, paleontologists c{an|~할 수 있다} reconstruct the appearance, behavior, and ecological relationships of extinct species. Techniques such as radiometric dating help determine the age of fossils and the geological context in which they were found. Research in paleontology contributes to our understanding of evolutionary processes, environmental changes, and the development of life on Earth."},{"source":"Screenshot 2026-09-15 at 23.15.00.png","template":"Grasshoppers are insects commonly found in dry places with grass and plants. Grasshoppers ha{ve|가지고 있다} several wa{ys|방법들} they pro{tect|보호한다} themselves aga{inst|~로부터} danger. Th{ey|그들은} have powe{rful|강력한} back le{gs|다리들}, which al{low|가능하게 한다} them t{o|~하도록} jump aw{ay|떨어져} from enemies, such as rodents and snakes. Some grasshoppers can jump twenty times the length of their bodies. By the time they are adults, grasshoppers can also fly. Adult grasshoppers fly very quickly and this helps them avoid danger."},{"source":"Screenshot 2026-09-15 ddressing climate change requires sustainable practices and international cooperation to mitigate its impacts."},{"source":"Screenshot 2026-09-15 at 23.12.37.png","template":"Tigers are solitary animals known for their territorial behavior; males use scent markings and vocalizations to define their territories. Each ma{le|수컷의} tiger estab{lishes|확립한다} control ov{er|~에 대한} a la{rge|넓은} territory span{ning|걸쳐 있는} several squ{are|제곱의} miles a{nd|그리고} patrols t{he|그} area regu{larly|정기적으로} to lo{ok|찾다} for prey and maintain dominance. This behavior helps reduce conflicts over prey, but tigers are known to fiercely defend their territory from intruders when necessary. Often hunting at night, tigers use stealth and their excellent night vision to their advantage."},{"source":"Screenshot 2026-09-15 at 23.14.52.png","template":"We know from drawings that have been preserved in caves for over 10,000 years that early humans performed dances as a group activity. We mi{ght|~일지도 모른다} think th{at|~라고} prehistoric peo{ple|사람들} concentrated on on{ly|오직} on t{he|그} basic wo{rk|일} that w{as|~이었다} required f{or|~에} survival: hun{ting|사냥}, gathering fo{od|음식}, and making weapons and garments. However, it is clear from the record that group dancing was important to them. They made masks and costumes; they used much energy in the process of dancing; they recorded more drawings of dancing than of any other group activity."},{"source":"Screenshot 2026-09-15 at 23.17.02.png","template":"The Renaissance was a period of cultural rebirth in Europe, spanning the fourteenth to seventeenth centuries. A vib{rant|활기찬} period o{f|~의} cultural, arti{stic|예술적인}, and intell{ectual|지적인} revival, t{he|그} Renaissance mar{ked|나타냈다} a ren{ewed|새로워진} interest i{n|~에 대한} classical liter{ature|문학}, a{nd|그리고} science. The Renaissance had a profound historical impact, serving as a bridge between the Middle Ages and the modern era. It sparked a cultural awakening that emphasized humanism, individual achievement,  revealed=false;const task=TASKS[at],draft=Array.isArray(drafts[at])?drafts[at]:[];
 el('task-select').value=String(at);el('title').textContent='Task '+(at+1)+' · '+task.title;el('progress-text').textContent='Task '+(at+1)+' / '+TASKS.length;el('progress').value=at+1;
 el('passage').innerHTML=task.parts.map(p=>typeof p==='string'?esc(p):wordHTML(p,Array.isArray(draft[p.index])?draft[p.index]:[])).join('');
 el('feedback').className='';el('feedback').innerHTML='';el('previous').disabled=at===0;el('next').textContent='다음 · 정답 확인';el('source').src='assets/tasks/task-'+String(at+1).padStart(2,'0')+'.png';el('source').parentElement.open=false;bindInputs();updateStatus();persist();
}
function bindInputs(){
 const all=inputs();
 all.forEach((input,k)=>{
  input.addEventListener('input',()=>{input.value=input.value.replace(/[^a-z]/gi,'').slice(-1);remember();if(input.value)all[k+1]?.focus()});
  input.addEventListener('keydown',event=>{
   if(event.key==='Backspace'&&!input.value&&k>0){event.preventDefault();all[k-1].value='';all[k-1].focus();remember()}
   if(event.key==='ArrowLeft'){event.preventDefault();all[k-1]?.focus()}
   if(event.key==='ArrowRight'){event.preventDefault();all[k+1]?.focus()}
   if(event.key==='Enter'){event.preventDefault();next()}
  });
  input.addEventListener('paste',event=>{
   event.preventDefault();const b=TASKS[at].blanks[Number(input.dataset.blank)],group=all.filter(x=>x.dataset.blank===input.dataset.blank);let text=event.clipboardData.getData('text').trim();let pos=Number(input.dataset.letter);
   if(text.length===b.word.length&&norm(text.slice(0,b.prefix.length))===norm(b.prefix)){text=text.slice(b.prefix.length);pos=0}
   if(!/^[a-z]+$/i.test(text))return;
   [...text].slice(0,group.length-pos).forEach((ch,j)=>group[pos+j].value=ch);remember();const last=group[Math.min(group.length-1,pos+text.length-1)];(all[all.indexOf(last)+1]||last).focus();
  });
 });
}
function contextFor(task,b){const n=task.parts.indexOf(b);const left=task.parts.slice(0,n).map(p=>typeof p==='string'?p:p.word).join('').trim().split(/\s+/).slice(-4).join(' ');const right=task.parts.slice(n+1).map(p=>typeof p==='string'?p:p.word).join('').trim().split(/\s+/).slice(0,5).join(' ');return esc(left)+' <strong>'+esc(b.word)+'</strong> '+esc(right)}
function grade(){
 remember();revealed=true;const task=TASKS[at],values=readDraft();let score=0;
 const result=task.blanks.map((b,i)=>{const answer=values[i].join(''),ok=values[i].every(v=>v.length===1)&&norm(answer)===norm(b.missing);if(ok)score++;el('word-'+i).classList.add(ok?'correct':'incorrect');return {b,answer,ok}});
 inputs().forEach(x=>x.disabled=true);
 el('status').textContent='정답과 해설을 확인한 뒤 다음 Task로 이동하세요.';
 el('feedback').className='result';el('feedback').innerHTML='<h3>'+score+' / 10 정답</h3><p class="result-note">'+esc(task.note)+'</p><div class="answer-list">'+result.map(({b,answer,ok})=>'<article class="answer-item"><h4><span class="'+(ok?'correct-mark':'incorrect-mark')+'">'+(ok?'✓':'✗')+'</span> '+esc(b.prefix)+'<span class="missing">'+esc(b.missing)+'</span> <small>· '+esc(b.meaning)+'</small></h4><p>입력한 부분: '+esc(answer||'미입력')+' → 정답: <b>'+esc(b.missing)+'</b></p><p class="context">… '+contextFor(task,b)+' …</p><p class="muted">이 표현에서 '+esc(b.word)+'는 “'+esc(b.meaning)+'”의 의미입니다. 주어진 '+esc(b.prefix)+'에 '+esc(b.missing)+'를 이어 완성합니다.</p></article>').join('')+'</div>';
 el('next').textContent=at===TASKS.length-1?'전체 완료 · Task 1로':'다음 Task →';el('feedback').scrollIntoView({block:'start',behavior:'smooth'});
}
function go(n){if(!revealed)remember();at=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function next(){if(!revealed){grade();return}go((at+1)%TASKS.length)}
el('task-select').innerHTML=TASKS.map((_,i)=>'<option value="'+i+'">Task '+(i+1)+'</option>').join('');
el('task-select').addEventListener('change',e=>go(Number(e.target.value)));el('previous').addEventListener('click',()=>go(Math.max(0,at-1)));el('next').addEventListener('click',next);render();
</script>
</body>
