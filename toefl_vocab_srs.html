const QUIZ_MODES = ['flash','quiz_ko','quiz_en','typed'];

const STORAGE_KEY = 'toefl-vocab-srs-v5';
const SESSION_KEY = 'toefl-vocab-session-v5';
const DAY = 86400000;
const MASTER_DUE = 365 * 10 * DAY;

// srsState is now namespaced per quiz format: srsState[quizMode][en] = {box, due, mastered, tier}
let srsState = {};
let sessionQueue = [];
let sessionIdx = 0;
let sessionStats = {sure: 0, vague: 0, guess: 0};
let quizMode = 'flash';
let sourceMode = 'new'; // new | review | master

const app = document.getElementById('app');

let keyMap = {};
document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (active && active.tagName === 'INPUT' && !active.disabled) {
    if (e.key === 'Enter' && keyMap['__inputEnter__']) { keyMap['__inputEnter__'](); }
    return;
  }
  const fn = keyMap[e.key];
  if (fn) { e.preventDefault(); fn(); }
});

const CLUSTER_COUNTS = {};
WORDS.forEach(w => { if (w.cl !== '\ub2e8\ub3c5') CLUSTER_COUNTS[w.cl] = (CLUSTER_COUNTS[w.cl]||0) + 1; });
function hasSynonymPartner(word) { return word.cl !== '\ub2e8\ub3c5' && CLUSTER_COUNTS[word.cl] >= 2; }
function normalizeKo(s) { return s.replace(/\(.*?\)/g, '').split(/[,\/\u00b7]/).map(t => t.trim()).filter(Boolean); }

function ensureNamespace(qMode) { if (!srsState[qMode]) srsState[qMode] = {}; return srsState[qMode]; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    srsState = raw ? JSON.parse(raw) : {};
  } catch (e) { srsState = {}; }
  QUIZ_MODES.forEach(ensureNamespace);
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(srsState)); }
  catch (e) { console.error('save failed', e); }
}
function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      ens: sessionQueue.map(w => w.en), idx: sessionIdx, quizMode, sourceMode, stats: sessionStats
    }));
  } catch (e) { console.error('session save failed', e); }
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed.ens || parsed.idx >= parsed.ens.length) return null;
    return parsed;
  } catch (e) { return null; }
}
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e) {} }

function getWordState(qMode, en) { return (srsState[qMode] && srsState[qMode][en]) || {box: 0, due: 0, mastered: false, tier: null}; }
function isMastered(qMode, en) { const s = srsState[qMode] && srsState[qMode][en]; return !!(s && (s.mastered || s.box >= 5)); }

// stats for the CURRENTLY selected quiz format only (mastery is per-format now)
function stats(qMode) {
  let mastered = 0, vagueCount = 0, guessCount = 0, fresh = 0;
  for (const w of WORDS) {
    const s = srsState[qMode] && srsState[qMode][w.en];
    if (!s) { fresh++; continue; }
    if (isMastered(qMode, w.en)) { mastered++; continue; }
    if (s.tier === 'vague') vagueCount++;
    else if (s.tier === 'guess') guessCount++;
  }
  return {mastered, vagueCount, guessCount, fresh, total: WORDS.length};
}

function buildSession(size, qMode, srcMode) {
  let base = WORDS;
  if (qMode === 'quiz_en') base = base.filter(hasSynonymPartner);

  if (srcMode === 'master') {
    const mastered = base.filter(w => isMastered(qMode, w.en));
    return mastered.sort(() => Math.random()-0.5).slice(0, size);
  }
  const notMastered = base.filter(w => !isMastered(qMode, w.en));
  if (srcMode === 'review') {
    const guessWords = notMastered.filter(w => srsState[qMode][w.en] && srsState[qMode][w.en].tier === 'guess');
    return guessWords.sort(() => Math.random()-0.5).slice(0, size);
  }
  const vagueWords = [], freshWords = [];
  for (const w of notMastered) {
    const s = srsState[qMode][w.en];
    if (!s) freshWords.push(w);
    else if (s.tier === 'vague') vagueWords.push(w);
  }
  return vagueWords.concat(freshWords).slice(0, size);
}

function pickKoDistractors(word) {
  const usedKo = new Set([word.ko.trim()]);
  let pool = word.cl !== '\ub2e8\ub3c5' ? WORDS.filter(w => w.cl === word.cl && w.en !== word.en) : [];
  pool = pool.sort(() => Math.random()-0.5);
  const rest = WORDS.filter(w => w.en !== word.en).sort(() => Math.random()-0.5);
  const candidates = [];
  function tryAdd(list) {
    for (const w of list) {
      if (candidates.length >= 3) break;
      const koKey = w.ko.trim();
      if (usedKo.has(koKey)) continue;
      usedKo.add(koKey);
      candidates.push(w);
    }
  }
  tryAdd(pool);
  if (candidates.length < 3) tryAdd(rest);
  return [word, ...candidates].sort(() => Math.random()-0.5);
}
function pickEnSynonymOptions(word) {
  const partners = WORDS.filter(w => w.cl === word.cl && w.en !== word.en);
  const correctWord = partners[Math.floor(Math.random()*partners.length)];
  let wrongPool = WORDS.filter(w => w.cl !== word.cl && w.en !== word.en && w.en !== correctWord.en);
  let wrongs = [];
  while (wrongs.length < 3) {
    const r = wrongPool[Math.floor(Math.random()*wrongPool.length)];
    if (!wrongs.includes(r)) wrongs.push(r);
  }
  return {options: [correctWord, ...wrongs].sort(() => Math.random()-0.5), correctWord};
}

function rate(qMode, en, tier) {
  let box, due, masteredFlag = false;
  if (tier === 'sure') { box = 5; masteredFlag = true; due = Date.now() + MASTER_DUE; }
  else if (tier === 'vague') { box = 1; due = Date.now(); }
  else { box = 0; due = Date.now(); }
  ensureNamespace(qMode)[en] = {box, due, mastered: masteredFlag, tier};
  saveState();
  sessionStats[tier]++;
}

// manual move from list screens (mastered <-> review) - same state shape as rate(), no session stats involved
function manualSetTier(qMode, en, tier) {
  let box, due, masteredFlag = false;
  if (tier === 'sure') { box = 5; masteredFlag = true; due = Date.now() + MASTER_DUE; }
  else { box = 0; due = Date.now(); }
  ensureNamespace(qMode)[en] = {box, due, mastered: masteredFlag, tier};
  saveState();
}

function el(tag, styleStr, html) {
  const e = document.createElement(tag);
  if (styleStr) e.style.cssText = styleStr;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function exportData() { return btoa(unescape(encodeURIComponent(JSON.stringify(srsState)))); }
function importDataStr(str) {
  try { srsState = JSON.parse(decodeURIComponent(escape(atob(str.trim())))); QUIZ_MODES.forEach(ensureNamespace); saveState(); return true; }
  catch (e) { return false; }
}
// ---------- cloud sync via jsonbin.io (compact format) ----------
const CLOUD_KEY = 'toefl-vocab-cloud-config';
const CLOUD_FORMAT_VERSION = 1;

/*
  중요:
  - localStorage의 srsState 구조는 기존 그대로 유지한다.
  - JSONBin으로 보낼 때만 압축한다.
  - 현재 앱에서 상태는 사실상 tier 하나로 복원 가능하다.

  sure  -> box 5 / mastered true
  vague -> box 1 / mastered false
  guess -> box 0 / mastered false

  단어명 자체도 저장하지 않고 WORDS 배열의 index를 base36으로 저장한다.

  예:
  exploit(index 0), sure -> "0s"
  prominent(index 3), guess -> "3g"

  따라서 기존 JSON보다 매우 작아진다.
*/

const TIER_TO_CODE = {
  sure: 's',
  vague: 'v',
  guess: 'g'
};

const CODE_TO_TIER = {
  s: 'sure',
  v: 'vague',
  g: 'guess'
};

function loadCloudConfig() {
  try {
    return JSON.parse(localStorage.getItem(CLOUD_KEY)) || {
      apiKey: '',
      binId: ''
    };
  } catch (e) {
    return {
      apiKey: '',
      binId: ''
    };
  }
}

function saveCloudConfig(cfg) {
  try {
    localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg));
  } catch (e) {}
}


// ----------------------------------------------------
// 클라우드용 압축
// ----------------------------------------------------

function packCloudState(state = srsState) {
  const packedModes = QUIZ_MODES.map(qMode => {
    const namespace = state[qMode] || {};
    const packed = [];

    WORDS.forEach((word, index) => {
      const s = namespace[word.en];
      if (!s) return;

      let tier = s.tier;

      // 예전 데이터에서 tier가 없더라도 최대한 복구
      if (!tier) {
        if (s.mastered || s.box >= 5) {
          tier = 'sure';
        } else if (s.box === 1) {
          tier = 'vague';
        } else {
          tier = 'guess';
        }
      }

      const code = TIER_TO_CODE[tier];
      if (!code) return;

      // index를 base36으로 바꿔 크기를 더 줄임
      packed.push(index.toString(36) + code);
    });

    return packed.join('.');
  });

  return {
    v: CLOUD_FORMAT_VERSION,
    q: packedModes
  };
}


// ----------------------------------------------------
// 압축된 클라우드 데이터 → 기존 srsState 복원
// ----------------------------------------------------

function unpackCloudState(record) {

  // 새 압축 포맷
  if (
    record &&
    record.v === CLOUD_FORMAT_VERSION &&
    Array.isArray(record.q)
  ) {
    const restored = {};

    QUIZ_MODES.forEach((qMode, modeIndex) => {
      restored[qMode] = {};

      const packedString = record.q[modeIndex] || '';
      if (!packedString) return;

      const entries = packedString.split('.');

      entries.forEach(token => {
        if (!token || token.length < 2) return;

        const tierCode = token.slice(-1);
        const indexPart = token.slice(0, -1);

        const wordIndex = parseInt(indexPart, 36);
        const tier = CODE_TO_TIER[tierCode];

        if (
          !Number.isInteger(wordIndex) ||
          !WORDS[wordIndex] ||
          !tier
        ) {
          return;
        }

        const word = WORDS[wordIndex];

        let box;
        let due;
        let mastered = false;

        if (tier === 'sure') {
          box = 5;
          mastered = true;
          due = Date.now() + MASTER_DUE;
        } else if (tier === 'vague') {
          box = 1;
          due = Date.now();
        } else {
          box = 0;
          due = Date.now();
        }

        restored[qMode][word.en] = {
          box,
          due,
          mastered,
          tier
        };
      });
    });

    return restored;
  }


  /*
    구버전 호환

    지금까지 JSONBin에 저장했던 데이터는
    srsState 자체가 그대로 들어가 있으므로
    새 포맷이 아니면 그냥 기존 데이터로 취급한다.

    즉 예전에 성공적으로 업로드한 Bin도 다운로드 가능.
  */
  return record || {};
}


// ----------------------------------------------------
// 실제 전송 크기
// ----------------------------------------------------

function getCloudPayload() {
  return packCloudState(srsState);
}

function getCloudPayloadSize() {
  const json = JSON.stringify(getCloudPayload());
  return new Blob([json]).size;
}

function formatBytes(bytes) {
  if (bytes < 1024) {
    return bytes + ' B';
  }

  return (bytes / 1024).toFixed(1) + ' KB';
}


// ----------------------------------------------------
// JSONBin 오류 내용 표시
// ----------------------------------------------------

async function makeJsonBinError(res) {
  let detail = '';

  try {
    const text = await res.text();

    if (text) {
      try {
        const parsed = JSON.parse(text);
        detail =
          parsed.message ||
          parsed.error ||
          text;
      } catch (e) {
        detail = text;
      }
    }
  } catch (e) {}

  if (detail) {
    return new Error(
      'HTTP ' + res.status + ' — ' + detail
    );
  }

  return new Error(
    'HTTP ' + res.status
  );
}


// ----------------------------------------------------
// 새 Bin 생성
// ----------------------------------------------------

async function createBin(apiKey) {

  const payload = getCloudPayload();

  const res = await fetch(
    'https://api.jsonbin.io/v3/b',
    {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': apiKey,
        'X-Bin-Private': 'true',
        'X-Bin-Name': 'toefl-vocab-srs'
      },

      body: JSON.stringify(payload)
    }
  );

  if (!res.ok) {
    throw await makeJsonBinError(res);
  }

  const data = await res.json();

  return data.metadata.id;
}


// ----------------------------------------------------
// 업로드
// ----------------------------------------------------

async function uploadToBin(apiKey, binId) {

  const payload = getCloudPayload();

  const res = await fetch(
    'https://api.jsonbin.io/v3/b/' + binId,
    {
      method: 'PUT',

      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': apiKey
      },

      body: JSON.stringify(payload)
    }
  );

  if (!res.ok) {
    throw await makeJsonBinError(res);
  }

  return await res.json();
}


// ----------------------------------------------------
// 다운로드
// ----------------------------------------------------

async function downloadFromBin(apiKey, binId) {

  const res = await fetch(
    'https://api.jsonbin.io/v3/b/' +
      binId +
      '/latest',
    {
      headers: {
        'X-Master-Key': apiKey
      }
    }
  );

  if (!res.ok) {
    throw await makeJsonBinError(res);
  }

  const data = await res.json();

  // 새 압축 포맷이든 기존 포맷이든 자동 처리
  return unpackCloudState(data.record);
}

    ['sure', '\uc644\uc804\ud788\n\uc54c\uc558\uc5b4\uc694', '#e8f5ee', '1'],

    ['guess', '\ucc0d\uc5c8\uc5b4\uc694', '#faeeda', '3']

  const map = {};
  opts.forEach(([tier, label, bg, key]) => {
    const b = el('button', `padding:10px 4px;border-radius:8px;border:1px solid #ddd;background:${bg};cursor:pointer;font-size:13px;text-align:center;line-height:1.3`,

}

  const srcRow = el('div', 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px');
  Object.keys(srcLabels).forEach(m => {
    const b = el('button', `padding:10px 6px;border-radius:8px;border:1px solid #ddd;cursor:pointer;background:${sourceMode===m?'#0F6E56':'#f5f5f5'};color:${sourceMode===m?'#fff':'#111'};font-size:12px`, srcLabels[m]);
    b.onclick = () => { sourceMode = m; renderHome(); };
    srcRow.appendChild(b);
  });
  wrap.appendChild(srcRow);
  const srcHints = {
    new: '\uc0c8 \ub2e8\uc5b4 + \uc774 \ud615\uc2dd\uc5d0\uc11c \uc560\ub9e4\ud558\uac8c \uc544\ub294 \ub2e8\uc5b4\ub9cc \ub098\uc635\ub2c8\ub2e4.',
    review: '\uc774 \ud615\uc2dd\uc5d0\uc11c \ucc0d\uc740(\uac70\uc758 \ubaa8\ub974\ub294) \ub2e8\uc5b4\ub9cc \uc9d1\uc911\uc801\uc73c\ub85c \ubc18\ubcf5\ud569\ub2c8\ub2e4.',
    master: '\uc774 \ud615\uc2dd\uc5d0\uc11c \uc774\ubbf8 \ub9c8\uc2a4\ud130\ud55c \ub2e8\uc5b4\ub9cc \ub2e4\uc2dc \ud14c\uc2a4\ud2b8\ud569\ub2c8\ub2e4.'
  };
  wrap.appendChild(el('div', 'font-size:12px;color:#888;margin-bottom:16px', srcHints[sourceMode]));

  wrap.appendChild(el('div', 'font-size:11px;color:#999;margin-bottom:16px',
    '\ud14c\uc2a4\ud2b8 \uc911\uc5d0\ub294 \ub9c8\uc6b0\uc2a4 \uc5c6\uc774 \ud0a4\ubcf4\ub4dc\ub85c\ub9cc \ud478\uc218 \uac00\ub2a5\ud569\ub2c8\ub2e4: \uac1d\uad00\uc2dd\uc740 \uc22b\uc790\ud0a4 1~4, \ud655\uc2e0\ub3c4\ub294 \uc22b\uc790\ud0a4 1~3, \ud0c0\uc774\ud551 \ubaa8\ub4dc\ub294 \uc785\ub825 \ud6c4 \uc5d4\ud130.'));

  wrap.appendChild(el('div', 'font-size:13px;color:#666;margin-bottom:8px', '\uc138\uc158 \ud06c\uae30 \uc120\ud0dd'));
  const sizeRow = el('div', 'display:flex;gap:8px;margin-bottom:20px');
  [10,50,100].forEach(n => {
    const b = el('button', 'flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;cursor:pointer;background:#f5f5f5;font-size:14px', n+'\uac1c');
    b.onclick = () => startSession(n);
    sizeRow.appendChild(b);
  });
  wrap.appendChild(sizeRow);

  wrap.appendChild(el('div', 'font-size:13px;color:#666;margin-bottom:6px', '\uae30\uae30 \uac04 \uc218\ub3d9 \ub3d9\uae30\ud654 (\ubc31\uc5c5 \ucf54\ub4dc)'));
  const syncRow = el('div', 'display:flex;gap:8px;margin-bottom:8px');
  const exportBtn = el('button', 'flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:13px', '\ub0b4\ubcf4\ub0b4\uae30 \ucf54\ub4dc \uc0dd\uc131');
  exportBtn.onclick = () => { prompt('\uc774 \ucf54\ub4dc\ub97c \ubcf5\uc0ac\ud574\uc11c \ub2e4\ub978 \uae30\uae30\uc5d0\uc11c \uac00\uc838\uc624\uae30\uc5d0 \ubd99\uc5ec\ub123\uc73c\uc138\uc694:', exportData()); };
  const importBtn = el('button', 'flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:13px', '\uac00\uc838\uc624\uae30 \ucf54\ub4dc \uc785\ub825');
  importBtn.onclick = () => {
    const code = prompt('\ub2e4\ub978 \uae30\uae30\uc5d0\uc11c \ubc1b\uc740 \ucf54\ub4dc\ub97c \ubd99\uc5ec\ub123\uc73c\uc138\uc694:');
    if (code) { if (importDataStr(code)) { alert('\uac00\uc838\uc624\uae30 \uc644\ub8cc'); renderHome(); } else alert('\ucf54\ub4dc\uac00 \uc62c\ubc14\ub974\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4'); }
  };
  syncRow.appendChild(exportBtn); syncRow.appendChild(importBtn);
  wrap.appendChild(syncRow);
  wrap.appendChild(el('div', 'font-size:11px;color:#999;margin-bottom:20px',
    '\uc774 \uae30\uae30(\uc774 \ube0c\ub77c\uc6b0\uc800)\uc5d0\ub9cc \uc790\ub3d9 \uc800\uc7a5\ub429\ub2c8\ub2e4. Claude \ucc44\ud305 \ud654\uba74 \uc548\uc758 \ubbf8\ub9ac\ubcf4\uae30\uac00 \uc544\ub2c8\ub77c, \ub2e4\uc6b4\ub85c\ub4dc\ud55c \ud30c\uc77c\uc744 \uc2e4\uc81c \uc0ac\ud30c\ub9ac/\ud06c\ub86c/\ud30c\uc77c\uc5d0\uc11c \uc9c1\uc811 \uc5f4\uc5b4\uc57c \uc548\uc815\uc801\uc73c\ub85c \uc800\uc7a5\ub429\ub2c8\ub2e4.'));

  renderCloudSection(wrap);

  const resetBtn = el('button', 'width:100%;padding:8px;border-radius:8px;border:1px solid #ddd;background:transparent;color:#888;font-size:12px;cursor:pointer', '\uc9c4\ud589 \uc0c1\ud669 \ucd08\uae30\ud654 (\ubaa8\ub4e0 \ud615\uc2dd)');
  resetBtn.onclick = () => {
    if (confirm('\ubaa8\ub4e0 \ubb38\uc81c \ud615\uc2dd\uc758 \ud559\uc2b5 \uc9c4\ud589 \uc0c1\ud669\uc744 \ucd08\uae30\ud654\ud560\uae4c\uc694? \uc774 \ub3d9\uc791\uc740 \ub418\ub3cc\ub9b4 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.')) {
      if (confirm('\uc815\ub9d0\ub85c \ucd08\uae30\ud654\ud560\uae4c\uc694? \ubaa8\ub4e0 \ud615\uc2dd\uc758 \ub9c8\uc2a4\ud130 \uae30\ub85d\uae4c\uc9c0 \ubaa8\ub450 \uc0ac\ub77c\uc9d1\ub2c8\ub2e4.')) {
        srsState = {}; QUIZ_MODES.forEach(ensureNamespace); saveState(); clearSession(); renderHome();
      }
    }
  };
  wrap.appendChild(resetBtn);
  app.appendChild(wrap);
}

function renderList(kind) {
  const items = WORDS.filter(w => {
    const s = srsState[quizMode] && srsState[quizMode][w.en];
    if (kind === 'mastered') return isMastered(quizMode, w.en);
    if (kind === 'due') return s && !isMastered(quizMode, w.en) && s.tier === 'guess';
    return false;
  });
  app.innerHTML = '';
  const wrap = el('div', 'padding:0.5rem 0 2rem');
  const title = kind === 'mastered' ? '\ub9c8\uc2a4\ud130\ud55c \ub2e8\uc5b4' : '\ubcf5\uc2b5 \ub300\uae30 \ub2e8\uc5b4';
  wrap.appendChild(el('div', 'font-size:18px;font-weight:600;margin-bottom:4px', `${title} (${items.length})`));
  wrap.appendChild(el('div', 'font-size:12px;color:#888;margin-bottom:12px', `\ubb38\uc81c \ud615\uc2dd: ${MODE_LABELS[quizMode]}`));
  const backBtn = el('button', 'padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:13px;margin-bottom:16px', '\u2190 \ud648\uc73c\ub85c');
  backBtn.onclick = renderHome;
  wrap.appendChild(backBtn);
  if (items.length === 0) {
    wrap.appendChild(el('div', 'font-size:14px;color:#888', '\ud574\ub2f9\ud558\ub294 \ub2e8\uc5b4\uac00 \uc5c6\uc5b4\uc694.'));
  } else {
    const list = el('div', 'display:flex;flex-direction:column;gap:8px');
    items.forEach(w => {
      const row = el('div', 'padding:10px 12px;border:1px solid #eee;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px');
      const textCol = el('div', 'flex:1;min-width:0');
      textCol.appendChild(el('div', 'font-weight:500;font-size:14px', w.en));
      textCol.appendChild(el('div', 'font-size:13px;color:#666', w.ko));
      row.appendChild(textCol);
      const moveBtn = el('button', 'padding:8px 10px;border-radius:8px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0',
        kind === 'mastered' ? '\u2192 \ubcf5\uc2b5\uc73c\ub85c' : '\u2192 \ub9c8\uc2a4\ud130\ub85c');
      moveBtn.onclick = () => {
        manualSetTier(quizMode, w.en, kind === 'mastered' ? 'guess' : 'sure');
        renderList(kind);
      };
      row.appendChild(moveBtn);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }
  app.appendChild(wrap);
}

function startSession(size) {
  sessionQueue = buildSession(size, quizMode, sourceMode);
  sessionIdx = 0;
  sessionStats = {sure:0, vague:0, guess:0};
  if (sessionQueue.length === 0) {
    const msgs = {
      new: '\uc9c0\uae08\uc740 \ud559\uc2b5\ud560 \uc0c8 \ub2e8\uc5b4\uac00 \uc5c6\uc5b4\uc694.',
      review: '\ubcf5\uc2b5\ud560 \ub2e8\uc5b4\uac00 \uc544\uc9c1 \uc5c6\uc5b4\uc694. \uba3c\uc800 \uc0c8 \ub2e8\uc5b4 \ubaa8\ub4dc\uc5d0\uc11c \"\ucc0d\uc5c8\uc5b4\uc694\"\ub97c \uace8\ub77c\ubcf4\uc138\uc694.',
      master: '\uc544\uc9c1 \ub9c8\uc2a4\ud130\ud55c \ub2e8\uc5b4\uac00 \uc5c6\uc5b4\uc694.'
    };
    alert(msgs[sourceMode]);
    return;
  }
  saveSession();
  renderCard();
}

function renderCard() {
  if (sessionIdx >= sessionQueue.length) { clearSession(); renderSummary(); return; }
  saveSession();
  const word = sessionQueue[sessionIdx];
  app.innerHTML = '';
  const wrap = el('div', 'padding:0.5rem 0 2rem');
  let advancing = false;
  function doAdvance() { if (advancing) return; advancing = true; sessionIdx++; renderCard(); }

  const topRow = el('div', 'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px');
  topRow.appendChild(el('div', 'font-size:12px;color:#888', `${sessionIdx+1} / ${sessionQueue.length}`));
  const exitBtn = el('button', 'padding:4px 10px;border-radius:6px;border:1px solid #ddd;background:transparent;color:#888;font-size:12px;cursor:pointer', '\u2190 \ub098\uac00\uae30 (\uc800\uc7a5\ub428)');
  exitBtn.onclick = () => { saveSession(); renderHome(); };
  topRow.appendChild(exitBtn);
  wrap.appendChild(topRow);

  const card = el('div', 'border:1px solid #ddd;border-radius:12px;padding:32px 24px;text-align:center;margin-bottom:16px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center');
  card.appendChild(el('div', 'font-size:26px;font-weight:600;margin-bottom:8px', word.en));

  function runMCQuiz(options, correctEn, correctDisplayText) {
    wrap.appendChild(card);
    const feedback = el('div', 'font-size:13px;min-height:20px;margin-bottom:8px;text-align:center');
    const optWrap = el('div', 'display:grid;grid-template-columns:1fr 1fr;gap:8px');
    const confZone = el('div', 'margin-top:8px');
    let answered = false;
    const optMap = {};
    options.forEach((opt, i) => {
      const label = quizMode === 'quiz_en' ? opt.en : opt.ko;
      const keyNum = String(i+1);
      const b = el('button', 'padding:12px 8px;border-radius:8px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:13px;text-align:center',
        `<span class="kbd">${keyNum}</span>${label}`);
      const handleClick = () => {
        if (answered) return;
        answered = true;
        keyMap = {};
        const correct = opt.en === correctEn;
        optWrap.querySelectorAll('button').forEach(btn2 => { btn2.style.opacity = '0.5'; });
        b.style.opacity = '1';
        b.style.background = correct ? '#e8f5ee' : '#fdecec';
        if (sourceMode === 'master') {
          // retention check: no confidence prompt, wrong answers are demoted instantly
          if (correct) {
            feedback.textContent = '\uc815\ub2f5 \u2014 \uacc4\uc18d \ub9c8\uc2a4\ud130 \uc0c1\ud0dc \uc720\uc9c0';
            feedback.style.color = '#0F6E56';
          } else {
            rate(quizMode, word.en, 'guess');
            feedback.textContent = `\uc624\ub2f5 \u2014 \ubcf5\uc2b5 \ub2e8\uc5b4\ub85c \uc774\ub3d9 (\uc815\ub2f5: ${correctDisplayText})`;
            feedback.style.color = '#993C1D';
          }
          keyMap = {'Enter': doAdvance};
          setTimeout(doAdvance, 700);
          return;
        }
        if (correct) {
          feedback.textContent = '\uc815\ub2f5 \u2014 \uc5bc\ub9c8\ub098 \ud655\uc2e0\ud588\ub098\uc694?';
          confidenceRow(confZone, (tier) => {
            rate(quizMode, word.en, tier); confZone.innerHTML = ''; keyMap = {'Enter': doAdvance};
            setTimeout(doAdvance, 500);
          });
        } else {
          rate(quizMode, word.en, 'guess');
          feedback.textContent = `\uc624\ub2f5 \u2014 \uc815\ub2f5: ${correctDisplayText}`;
          feedback.style.color = '#993C1D';
          keyMap = {'Enter': doAdvance};
          setTimeout(doAdvance, 1200);
        }
      };
      b.onclick = handleClick;
      optMap[keyNum] = handleClick;
      optWrap.appendChild(b);
    });
    keyMap = optMap;
    wrap.appendChild(feedback); wrap.appendChild(optWrap); wrap.appendChild(confZone);
  }

  if (quizMode === 'flash') {
    const meaningEl = el('div', 'font-size:16px;color:#666;visibility:hidden', word.ko + (word.cl!=='\ub2e8\ub3c5' ? ` \u00b7 [${word.cl}]` : ''));
    card.appendChild(meaningEl);
    wrap.appendChild(card);
    const revealBtn = el('button', 'width:100%;padding:12px;border-radius:8px;border:none;background:#0F6E56;color:#fff;font-size:14px;cursor:pointer;margin-bottom:12px',
      '<span class="kbd">\u21b5</span>\ub73b \ubcf4\uae30');
    const confZone = el('div');
    const doReveal = () => {
      meaningEl.style.visibility = 'visible'; revealBtn.style.display='none';
      if (sourceMode === 'master') {
        binaryMasteryRow(confZone,
          () => { doAdvance(); },
          () => { rate(quizMode, word.en, 'guess'); doAdvance(); }
        );
      } else {
        confidenceRow(confZone, (tier) => { rate(quizMode, word.en, tier); doAdvance(); });
      }
    };
    revealBtn.onclick = doReveal;
    keyMap = {'Enter': doReveal};
    wrap.appendChild(revealBtn);
    wrap.appendChild(confZone);

  } else if (quizMode === 'quiz_ko') {
    runMCQuiz(pickKoDistractors(word), word.en, word.ko);
  } else if (quizMode === 'quiz_en') {
    const {options, correctWord} = pickEnSynonymOptions(word);
    runMCQuiz(options, correctWord.en, `${correctWord.en} (${correctWord.ko})`);

  } else if (quizMode === 'typed') {
    wrap.appendChild(card);
    const inputRow = el('div', 'display:flex;gap:8px;margin-bottom:8px');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '\uc774 \ub2e8\uc5b4\uc758 \ud55c\uae00 \ub73b\uc744 \uc785\ub825\ud558\uc138\uc694 (\uc5d4\ud130\ub85c \ud655\uc778)';
    input.style.cssText = 'flex:1;padding:12px;border-radius:8px;border:1px solid #ddd;font-size:16px';
    const submitBtn = el('button', 'padding:12px 16px;border-radius:8px;border:none;background:#0F6E56;color:#fff;font-size:14px;cursor:pointer', '\ud655\uc778');
    inputRow.appendChild(input); inputRow.appendChild(submitBtn);
    wrap.appendChild(inputRow);
    const resultZone = el('div', 'margin-top:8px');
    let submitted = false;
    function doSubmit() {
      if (submitted) return;
      submitted = true;
      const userVal = input.value.trim();
      const tokens = normalizeKo(word.ko);
      const autoMatch = tokens.some(t => t && userVal.length > 0 && (userVal.includes(t) || t.includes(userVal)));
      resultZone.innerHTML = '';
      resultZone.appendChild(el('div', 'font-size:13px;margin-bottom:4px', `\ub0b4 \ub2f5: ${userVal || '(\ube48 \ub2f5)'}`));
      resultZone.appendChild(el('div', 'font-size:13px;margin-bottom:8px;color:#666', `\uc815\ub2f5: ${word.ko}` + (autoMatch ? ' \u00b7 \uc790\ub3d9 \ube44\uad50: \ube44\uc2b7\ud574 \ubcf4\uc784' : '')));
      resultZone.appendChild(el('div', 'font-size:12px;color:#888;margin-bottom:8px', '\uc2a4\uc2a4\ub85c \ucc44\uc810\ud574\uc8fc\uc138\uc694'));
      const confZone = el('div');
      if (sourceMode === 'master') {
        binaryMasteryRow(confZone,
          () => { doAdvance(); },
          () => { rate(quizMode, word.en, 'guess'); doAdvance(); }
        );
      } else {
        confidenceRow(confZone, (tier) => { rate(quizMode, word.en, tier); doAdvance(); });
      }
      resultZone.appendChild(confZone);
      submitBtn.style.display = 'none'; input.disabled = true;
    }
    submitBtn.onclick = doSubmit;
    keyMap = {'__inputEnter__': doSubmit};
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSubmit(); });
    wrap.appendChild(resultZone);
    setTimeout(() => input.focus(), 50);
  }

  app.appendChild(wrap);
}

function renderSummary() {
  keyMap = {};
  app.innerHTML = '';
  const wrap = el('div', 'padding:0.5rem 0 2rem;text-align:center');
  wrap.appendChild(el('div', 'font-size:18px;font-weight:600;margin-bottom:12px', '\uc138\uc158 \uc644\ub8cc'));
  wrap.appendChild(el('div', 'font-size:14px;color:#666;margin-bottom:24px',
    `완전히 앎 ${sessionStats.sure} · 애매 ${sessionStats.vague} · 찍음 ${sessionStats.guess}`));
  const homeBtn = el('button', 'padding:12px 24px;border-radius:8px;border:none;background:#0F6E56;color:#fff;font-size:14px;cursor:pointer', '\ud648\uc73c\ub85c');
  homeBtn.onclick = renderHome;
  wrap.appendChild(homeBtn);
  app.appendChild(wrap);
}

loadState();
renderHome();
</script>
</body>
</html>
