function sentence(id,parts,src,difficulty,note,nested=[]){
 let tokens=[],nodes=[];for(const [role,text] of parts){const start=tokens.length;tokens.push(...tok(text));nodes.push({role,ranges:[[start,tokens.length-1]],type:types[role]});}
 const verbs=nodes.filter(n=>n.role==='V');const mainVerb={role:'V',ranges:verbs.flatMap(n=>n.ranges),type:types.V};
 return {id,text:tokens.join(' '),tokens,source:src,difficulty,note,syntax:{nodes,subject:nodes.find(n=>n.role==='S'||n.role==='EX'),mainVerb,object:nodes.find(n=>n.role==='O'),complement:nodes.find(n=>n.role==='C'||n.role==='NP'),nested},grammarPatterns:[...new Set(nodes.map(n=>n.role))]};

{id:'p-invasive1',title:'Invasive Plants · 1',source:SRC.r,text:'Invasive plants are plants that spread outside their native range. When these plants possess traits such as aggressive growth, high reproductive rates, and resistance to local pests, they can outcompete indigenous vegetation for sunlight, water, and nutrients. Invasive species can be found in many ecosystems, from wetlands and forests to urban areas. Their presence may reduce biodiversity, alter soil composition, and disrupt water cycles.'},
{id:'p-invasive2',title:'Invasive Plants · 2',source:SRC.r,text:'These plants impact both natural and managed ecosystems. Natural areas may lose native plant populations, which negatively affects the insects and animals that rely on them. Agricultural lands often suffer from diminished crop yields, as invasive plants are difficult to control. Some species can also increase the risk of flooding. For example, Japanese knotweed overruns stream banks and makes it easy for water to overflow, while purple loosestrife forms dense clusters in wetlands.'},
{id:'p-invasive3',title:'Invasive Plants · 3',source:SRC.r,text:'Invasive plants often spread as a result of human activity, such as the unintentional transportation of seeds in cargo. Ornamental plants in gardens may also establish new populations in nearby areas. Animals and wind further aid the spread of invasive plants by dispersing seeds over large distances. Additionally, changes in land use, such as deforestation, can create environments that favor invasive species.'},

const NEW30_DATA=[{"day":1,"page":258,"paragraph":1,"text":"Covering over 800 acres in the heart of Manhattan, Central Park in New York City is one of the most iconic urban parks in the United States. Conceived during the mid-nineteenth century, the park was created as a response to rapid urbanization and industrial growth, which left city residents with little access to natural spaces. Frederick Law Olmsted, who co-designed the park with Calvert Vaux, saw parks as integral in creating healthier and more democratic cities.","structure":[[["PART","Covering over 800 acres in the heart of Manhattan,"],["S","Central Park in New York City"],["V","is"],["C","one of the most iconic urban parks in the United States."]],"iconic","형용사","urban parks","Adj+N","도시 공원","분사절을 제외한 Central Park in New York City가 주어입니다. is 뒤 명사구 전체는 주격 보어입니다."],"writing":["Do you have any spare envelopes I could use?","Have you|tried looking|in the supply closet?",68,12,1]},{"day":2,"page":258,"paragraph":2,"text":"Olmsted and Vaux employed a naturalistic style, incorporating meadows, woodlands, and bodies of water to evoke the countryside within the city. They also planned winding paths, scenic viewpoints, and diverse plantings that offered both beauty and function. This balance of utility and aesthetics marked a significant development in American landscape architecture.","structure":[[["S","This balance of utility and aesthetics"],["V","marked"],["O","a significant development in American landscape architecture."]],"significant","형용사","landscape architecture","N+N","조경 건축","of utility and aesthetics는 주어 내부 수식어입니다. marked 뒤 목적어에 in American landscape architecture를 포함합니다."],"writing":["Who was chosen to represent our class at the competition?","I|have no idea|who|ended up|being selected.",68,12,2]},{"day":3,"page":258,"paragraph":3,"text":"For urban dwellers of all backgrounds, the park provided relief from the pressures of industrial city life. Its green spaces demonstrated how thoughtful planning could improve public health and enhance community well-being. Today, Central Park remains a case study for urban park planners and a lasting symbol of how landscape design can shape urban life through both aesthetics and social benefits.","structure":[[["PP","For urban dwellers of all backgrounds,"],["S","the park"],["V","provided"],["O","relief"],["PP","from the pressures of industrial city life."]],"provided","동사","provided relief","V+N","안도·휴식을 제공했다","provided가 주절 동사입니다. from 이하는 무엇에서 벗어나는지를 나타내는 전치사구입니다."],"writing":["Are you worried about having to lead the new project?","My only concern|is|whether|we have the time|to complete it.",68,12,3]},{"day":4,"page":262,"paragraph":1,"text":"Habitus is a concept developed by French sociologist Pierre Bourdieu. It refers to the deeply embedded habits, skills, and ways of perceiving the world that individuals develop through their cultural and social experiences. Habitus shapes unconscious actions, patterns of thought, and preferences in daily life and explains why people from similar backgrounds often display comparable behaviors.","structure":[[["S","Habitus"],["V","is"],["C","a concept developed by French sociologist Pierre Bourdieu."]],"concept","명사","French sociologist","Adj+N","프랑스 사회학자","developed 이하는 concept를 수식하는 과거분사절로 주격 보어 안에 포함됩니다."],"writing":["Can you tell me what Anthony was asking about just now?","He|was curious about|what|I was planning|for the weekend.",68,12,4]},{"day":5,"page":262,"paragraph":2,"text":"A familiar example of habitus can be seen in classroom etiquette. Children who grow up in families emphasizing punctuality, quiet listening, and respect for authority often retain these dispositions until they graduate. Such students instinctively understand classroom expectations and adapt accordingly. On the other hand, children who were not exposed to these norms early in life may struggle to fit in despite wanting to, and this demonstrates how habitus operates below conscious awareness.","structure":[[["S","A familiar example of habitus"],["V","can be seen"],["PP","in classroom etiquette."]],"familiar","형용사","classroom etiquette","N+N","교실 예절","can be seen 전체가 조동사를 포함한 수동태 동사 핵심입니다. 목적어는 없습니다."],"writing":["Did the staff say anything about the new leave policy?","They|wanted to know|when|it would take effect.",68,12,5]},{"day":6,"page":262,"paragraph":3,"text":"Habitus continues to influence behaviors in adulthood. For instance, professionals today who were raised in families working in the corporate world may feel more comfortable in formal business settings, understand unwritten rules of networking, and select business attire that suits the context. This invisible framework created by habitus guides choices and reactions throughout life, reflecting how social position and life experiences shape both individual identity and collective cultural practices.","structure":[[["S","Habitus"],["V","continues"],["TINF","to influence behaviors in adulthood."]],"influence","동사","influence behaviors","V+N","행동에 영향을 미치다","to influence 이하는 continues를 보충하는 부정사절입니다. 목적을 나타내는 부사절과 구별합니다."],"writing":["We need a new coffee machine for the break room.","Do you|remember|where|we bought|the last one?",69,12,6]},{"day":7,"page":264,"paragraph":1,"text":"In 1974, a team of anthropologists discovered fossilized remains of a hominid (early human) in Ethiopia. The skeleton, later named \"Lucy,\" comprised 47 bone fragments (about 40 percent of the total). Estimated to be a small adult female, she stood just over a meter tall and weighed around 29 kilograms. Her anatomy—long arms, and curved finger and toe bones—suggested she retained adaptations for climbing trees.","structure":[[["PP","In 1974,"],["S","a team of anthropologists"],["V","discovered"],["O","fossilized remains of a hominid (early human)"],["PP","in Ethiopia."]],"fossilized","형용사","fossilized remains","Adj+N","화석화된 유해","of anthropologists는 주어 안에, of a hominid는 목적어 안에 포함됩니다."],"writing":["When will the next shipment of books arrive?","They|are scheduled|to be delivered|in a couple of days.",69,12,7]},{"day":8,"page":264,"paragraph":2,"text":"Before Lucy's discovery, scientists debated whether bipedalism (upright walking) or brain development came first. Early fossils were often found with few bones below the skulls, making it hard to establish a timeline of upright walking. The pelvis and leg fragments from Lucy's skeleton provided clear evidence of an early hominid that walked upright yet had a small brain, confirming that bipedalism evolved before large brain development.","structure":[[["PP","Before Lucy's discovery,"],["S","scientists"],["V","debated"],["O","whether bipedalism (upright walking) or brain development came first."]],"development","명사","brain development","N+N","뇌 발달","whether 이하는 debated의 목적어인 내포 의문절입니다. came은 내포절 동사입니다."],"writing":["I heard our company is getting us new computers.","Do you|know|when|that is supposed|to happen?",69,12,8]},{"day":9,"page":264,"paragraph":3,"text":"Lucy's discovery also provided instrumental evidence for the anthropological understanding of human dispersal patterns by dating a bipedal hominid to 3.2 million years ago in East Africa. By placing the critical stages of early hominid evolution on the African continent, Lucy's discovery solidified Africa's role as the \"cradle of humanity,\" reinforcing the importance of East Africa as the point of origin for fundamental human traits.","structure":[[["S","Lucy's discovery"],["ADV","also"],["V","provided"],["O","instrumental evidence for the anthropological understanding of human dispersal patterns"],["PP","by dating a bipedal hominid to 3.2 million years ago in East Africa."]],"instrumental","형용사","instrumental evidence","Adj+N","핵심적인 증거","also는 부사입니다. for 이하가 evidence의 내용을 한정합니다. by 이하는 증거를 제공한 방법입니다."],"writing":["Are the Wilsons coming to the party this weekend?","Don't you|know|they can't make it|this weekend?",69,12,9]},{"day":10,"page":267,"paragraph":1,"text":"Genetic diversity is the total number of variations within the genetic makeup of a species. This diversity allows populations to respond to environmental changes, such as new diseases or climate shifts. For example, within a species, some individuals may carry genes that make them resistant to certain illnesses, while others might be sensitive. This means that if a disease affects a population, not all individuals will be affected in the same way, allowing some to survive and reproduce.","structure":[[["S","Genetic diversity"],["V","is"],["C","the total number of variations within the genetic makeup of a species."]],"makeup","명사","genetic makeup","Adj+N","유전적 구성","is 뒤 명사구 전체가 주격 보어입니다. within 이하는 variations의 범위를 한정합니다."],"writing":["I'm excited to see Ellie perform in the musical.","Did she|tell you|what role|she's playing|in the show?",69,12,10]},{"day":11,"page":267,"paragraph":2,"text":"Genetic diversity is crucial for agriculture. Plant breeders rely on selective breeding to develop crops with desirable traits like high yield. This often results in genetic uniformity, which renders the entire crop highly vulnerable to new diseases. For instance, the 1970 Southern corn leaf blight epidemic in the U.S. destroyed over half the maize crop because most commercial maize shared a susceptible genetic foundation.","structure":[[["S","Genetic diversity"],["V","is"],["C","crucial for agriculture."]],"crucial","형용사","crucial for","Adj+Prep","~에 매우 중요한","crucial은 형용사 보어이고 for agriculture는 그 형용사를 보충하므로 보어 범위에 함께 포함합니다."],"writing":["Is the company planning to open a new branch?","Have you|heard|if|they're making|an announcement?",308,63,1]},{"day":12,"page":267,"paragraph":3,"text":"To prevent such losses, scientists actively utilize the broad genetic diversity stored in gene banks. These facilities house seeds from thousands of plant varieties, including wild relatives. Researchers study this diversity to identify resistance genes and introduce them into commercial crops through breeding, thereby creating a crucial genetic defense against future threats.","structure":[[["INF","To prevent such losses,"],["S","scientists"],["ADV","actively"],["V","utilize"],["O","the broad genetic diversity stored in gene banks."]],"actively","부사","gene banks","N+N","유전자 은행","To prevent는 목적의 부정사절입니다. stored 이하는 diversity를 수식하여 목적어 안에 포함됩니다."],"writing":["Are you joining the language exchange club this semester?","I|have not decided|whether|I'm going to join|yet.",308,63,2]},{"day":13,"page":270,"paragraph":1,"text":"Pareidolia is a phenomenon where the brain quickly perceives recognizable shapes, especially faces, in random patterns or objects. Research suggests that pareidolia occurs when the brain's pattern recognition systems become hyperactive, causing neural pathways to misinterpret ambiguous visual stimuli as meaningful objects. This cognitive shortcut leads the brain to \"fill in\" missing information based on stored memories and expectations.","structure":[[["S","This cognitive shortcut"],["V","leads"],["O","the brain"],["TINF","to \"fill in\" missing information based on stored memories and expectations."]],"cognitive","형용사","missing information","Adj+N","빠진 정보","leads + 목적어 + to부정사 보충절입니다. to부정사는 목적 부사절이 아닙니다."],"writing":["I heard there will be a leadership workshop on Friday.","Will there be|any preparation materials|we should review|beforehand?",308,63,3]},{"day":14,"page":270,"paragraph":2,"text":"A famous case of pareidolia called \"the face on Mars\" occurred in 1976, when NASA's Viking probe sent back a photo of the Martian surface. The image appeared to show a large human-like face, leading to widespread public speculation about life on Mars. Later, higher-definition pictures taken under different lighting revealed it to be a mesa, a type of rock formation also common on Earth. Nevertheless, the incident attracted global attention and fueled discussions of the possible existence of extraterrestrial intelligence.","structure":[[["S","The image"],["V","appeared"],["TINF","to show a large human-like face,"],["PART","leading to widespread public speculation about life on Mars."]],"widespread","형용사","public speculation","Adj+N","대중의 추측","appeared 뒤 to show는 보충 부정사절입니다. 쉼표 뒤 leading 이하는 결과를 덧붙이는 분사절입니다."],"writing":["What questions did the interviewer have for you?","She|was interested in|what|I gained|from my previous job.",308,63,4]},{"day":15,"page":270,"paragraph":3,"text":"From an evolutionary perspective, pareidolia likely developed as a survival advantage. Our ancestors who were highly sensitive to detecting faces could better identify social allies and potential predators. This hypersensitive face-detection system created beneficial \"false positives,\" where occasionally seeing non-existent faces was preferable to missing real ones.","structure":[[["PP","From an evolutionary perspective,"],["S","pareidolia"],["ADV","likely"],["V","developed"],["PP","as a survival advantage."]],"evolutionary","형용사","survival advantage","N+N","생존상의 이점","likely는 여기서 부사이며 developed가 동사 핵심입니다. 앞뒤 전치사구는 따로 분석합니다."],"writing":["I was wondering if you watched the documentaries I recommended.","I|have not had|a chance|to watch them.",308,63,5]},{"day":16,"page":272,"paragraph":1,"text":"The Chinese room thought experiment, created by philosopher John Searle, is designed to question whether computers can truly understand language or if they just process symbols mechanically. In this scenario, a person who does not speak Chinese sits in a room. This person receives questions written in Chinese and uses an instruction manual to choose the correct Chinese symbols as answers. To outsiders, the responses seem fluent, yet the person does not understand the language. Searle argues that the person is merely manipulating symbols based on rules, not meaning.","structure":[[["PP","In this scenario,"],["S","a person who does not speak Chinese"],["V","sits"],["PP","in a room."]],"sits","동사","speak Chinese","V+N","중국어를 말하다","who does not speak Chinese는 person의 제한적 관계절이므로 주어 전체에 포함합니다."],"writing":["I'm thinking of signing up for that new fitness program.","Is that|the one|where|you exercise outdoors|with a trainer?",309,63,6]},{"day":17,"page":272,"paragraph":2,"text":"This argument has generated several responses. Some philosophers claim that although the individual does not understand Chinese, the whole system—the room, the person, the instructions—constitutes a mind that does understand the language. Others suggest that the whole system would need to be able to interact with the outside world to develop genuine understanding. Another response proposes that if the system replicated the exact biological processes of a human brain, a true understanding of Chinese would emerge.","structure":[[["S","This argument"],["V","has generated"],["O","several responses."]],"generated","동사","generated several responses","V+N","여러 반응을 이끌어냈다","has generated는 현재완료 동사 핵심이며 several responses가 목적어입니다."],"writing":["I started an online course about stress management techniques.","On which platform|did you|find it?",309,63,7]},{"day":18,"page":272,"paragraph":3,"text":"The Chinese room thought experiment highlights a core debate in artificial intelligence (AI): whether computational processes alone can create genuine understanding or consciousness. AI systems produce fluent responses without possessing conscious awareness. As technology advances, distinguishing between genuine understanding and sophisticated symbol manipulation becomes important.","structure":[[["S","AI systems"],["V","produce"],["O","fluent responses"],["PP","without possessing conscious awareness."]],"fluent","형용사","conscious awareness","Adj+N","의식적 자각","without은 전치사이며 뒤의 동명사절을 포함해 하나의 전치사구로 선택합니다."],"writing":["We might need to reschedule today's meeting.","Okay. Just|let me know|what time|works best|for you.",309,63,8]},{"day":19,"page":274,"paragraph":1,"text":"The history of passenger jets reflects the story of progress and advancement. Before the jet age, commercial air travel relied on slow propeller planes. In 1952, the De Havilland Comet became the first commercial jet to enter service, promising shorter flight times and greater comfort.","structure":[[["S","The history of passenger jets"],["V","reflects"],["O","the story of progress and advancement."]],"reflects","동사","passenger jets","N+N","여객 제트기","두 of 전치사구는 각각 주어와 목적어 명사구 내부에 포함됩니다."],"writing":["Didn't I see Brian talking to you earlier?","He|asked|whether|I could teach|the new training program.",309,63,9]},{"day":20,"page":274,"paragraph":2,"text":"However, the initial excitement around the Comet quickly gave way to serious safety concerns. Within just a few years, several catastrophic accidents occurred with the Comet. Repeated cabin pressurization and flawed window design led to metal fatigue, causing ruptures during flight. These incidents severely undermined public trust in jet airliners.","structure":[[["S","These incidents"],["ADV","severely"],["V","undermined"],["O","public trust in jet airliners."]],"severely","부사","public trust","Adj+N","대중의 신뢰","severely를 동사 핵심에 넣지 않습니다. in jet airliners는 trust의 대상을 보충합니다."],"writing":["Has the program you requested been installed yet?","No,|it is supposed|to be installed|on Monday.",309,63,10]},{"day":21,"page":274,"paragraph":3,"text":"Lessons from the Comet paved the way for more reliable jets. One of them, the Boeing 707, entered service in 1958, and though it was smaller than modern jets, it was widely adopted by airlines. In 1970, the Boeing 747, the first wide-body passenger jet, entered service. The arrival of wide-body jets transformed not only the airline industry but also global connectivity, making international tourism and trade much easier.","structure":[[["S","Lessons from the Comet"],["V","paved"],["O","the way"],["PP","for more reliable jets."]],"reliable","형용사","paved the way","V+N","길을 열었다","paved가 동사 핵심이고 the way는 목적어입니다. paved the way는 별도 표현 훈련 범위입니다."],"writing":["Some friends and I are going camping next week.","I|hope|the weather|is good|for camping.",314,67,1]},{"day":22,"page":282,"paragraph":1,"text":"Cone snails are found mostly in the reefs and sandy coastal areas of tropical waters. Their shells display vibrant colors and unique patterns, making them highly sought after by collectors. Cone snails move slowly and use a tube-like organ called a siphon to detect prey such as small fish, marine worms, and other mollusks on the ocean floor.","structure":[[["S","Cone snails"],["V","are found"],["ADV","mostly"],["PP","in the reefs and sandy coastal areas of tropical waters."]],"mostly","부사","tropical waters","Adj+N","열대 해역","are found는 수동태 동사 핵심입니다. mostly는 부사이고 위치 정보는 전치사구입니다."],"writing":["Do you know if anyone is taking time off next week?","I|have not checked|who|plans to be|on leave.",314,67,2]},{"day":23,"page":282,"paragraph":2,"text":"One of the most remarkable features of cone snails is their venom. To catch prey, they deploy a specialized harpoon-like tooth that injects a mix of potent toxins known as conotoxins. These toxins quickly immobilize prey by interfering with the victim's nerve signals. For humans, the sting of certain species can be life-threatening, and there is no specific antivenom. Even if a person does not die from a cone snail sting, the venom can cause rapid and severe symptoms.","structure":[[["S","These toxins"],["ADV","quickly"],["V","immobilize"],["O","prey"],["PP","by interfering with the victim's nerve signals."]],"immobilize","동사","nerve signals","N+N","신경 신호","quickly를 제외한 immobilize가 동사 핵심입니다. by 이하는 방법을 나타냅니다."],"writing":["What did Kathleen say about the event on Saturday?","She|asked|if|she could get a ride|to the event.",314,67,3]},{"day":24,"page":282,"paragraph":3,"text":"Nonetheless, these snails are beneficial. They consume small marine animals before they become too great in number for an ecosystem to support. Scientists are also researching conotoxins to develop new painkillers and treatments for nervous system disorders, due to the ability of these substances to block targeted nerve channels.","structure":[[["S","Scientists"],["V","are"],["ADV","also"],["V","researching"],["O","conotoxins"],["INF","to develop new painkillers and treatments for nervous system disorders,"],["PP","due to the ability of these substances to block targeted nerve channels."]],"targeted","형용사","nervous system disorders","N+N","신경계 질환","are와 researching 사이의 also는 부사입니다. to develop은 연구 목적이며 due to 이하는 연구의 근거를 제시합니다."],"writing":["Are you sure you want to buy that speaker model?","It|sounds clearer|than all the other models|on display.",314,67,4]},{"day":25,"page":284,"paragraph":1,"text":"Cryptomnesia is a psychological phenomenon in which a person believes they have generated an original idea, memory, or creative work, when in fact they are unconsciously recalling something they previously encountered. This term was coined by Swiss psychologist Theodore Flournoy during his research on automatic writing—producing words without conscious thought—where he observed subjects producing \"new\" material that was actually derived from forgotten sources.","structure":[[["S","Cryptomnesia"],["V","is"],["C","a psychological phenomenon in which a person believes they have generated an original idea, memory, or creative work, when in fact they are unconsciously recalling something they previously encountered."]],"psychological","형용사","creative work","Adj+N","창작물","in which 이하가 phenomenon의 의미를 한정하므로 주격 보어 범위에 포함됩니다. 내포절의 동사를 주절 is와 구별합니다."],"writing":["What did your boss say when you told him the news?","He|was confused about|why|I decided|to quit my job.",314,67,5]},{"day":26,"page":284,"paragraph":2,"text":"Researchers suggest that cryptomnesia often arises from failures in source monitoring. Source monitoring refers to the mental process that allows people to distinguish between remembered and newly formed ideas. When this system breaks down, past material may resurface as if it were original. Such lapses underscore the instability of memory and its broad influence on how individuals think, create, and judge the originality of their own ideas.","structure":[[["S","Researchers"],["V","suggest"],["O","that cryptomnesia often arises from failures in source monitoring."]],"often","부사","source monitoring","N+N","정보 출처 점검","that절 전체가 suggest의 목적어입니다. arises는 내포절 동사이고 often은 내포절 부사입니다."],"writing":["I was wondering where I could get my uniform.","The team manager|is in charge of|distributing the uniforms.",315,67,6]},{"day":27,"page":284,"paragraph":3,"text":"Cryptomnesia cannot be identified with certainty, since no one method reliably distinguishes unconscious reuse from deliberate plagiarism. Behavioral source-monitoring studies, drafts and timestamps, or computational similarity tools each provide partial insights. However, researchers emphasize the value of cross-checking multiple clues. In this way, they help raise justified suspicion of possible plagiarism.","structure":[[["ADV","However,"],["S","researchers"],["V","emphasize"],["O","the value of cross-checking multiple clues."]],"multiple","형용사","multiple clues","Adj+N","여러 단서","However는 연결 부사입니다. of cross-checking multiple clues는 value를 보충하는 목적어 내부 성분입니다."],"writing":["What do you think we should do to improve product quality?","Let's see|what|the manufacturing team|has to say.",315,67,7]},{"day":28,"page":286,"paragraph":1,"text":"Sleep spindles are brief bursts of brain activity lasting between half a second and two seconds that occur during sleep. They typically emerge every three to six seconds during non-rapid eye movement (NREM) sleep. The generation of sleep spindles involves interactions between the thalamus, which relays sensory signals, and the cerebral cortex, the brain's outer layer responsible for higher cognitive functions.","structure":[[["S","They"],["ADV","typically"],["V","emerge"],["ADV","every three to six seconds"],["PP","during non-rapid eye movement (NREM) sleep."]],"typically","부사","eye movement","N+N","안구 운동","typically와 every three to six seconds는 각각 별도 부사어입니다. 동사 핵심은 emerge입니다."],"writing":["I wish I hadn't missed the new student orientation session.","You|should contact|the student affairs office|to see|what you missed.",315,67,8]},{"day":29,"page":286,"paragraph":2,"text":"Research has verified that sleep spindles are vital for helping the brain consolidate new memories. In studies involving both children and adults, a direct relationship between spindle frequency and the ability to retain new facts or procedures after sleep has been found. Perhaps equally importantly, spindles appear to shield sleepers from being roused by noises or disruptions.","structure":[[["S","Research"],["V","has verified"],["O","that sleep spindles are vital for helping the brain consolidate new memories."]],"vital","형용사","consolidate new memories","V+N","새 기억을 공고히 하다","has verified는 완료형 동사 핵심입니다. that절 전체가 목적어이며 are는 내포절 동사입니다."],"writing":["Do you know the price for a consultation with Dr. Fleming?","I|have no idea|how much|it will cost.",315,67,9]},{"day":30,"page":286,"paragraph":3,"text":"Further studies indicate that sleep spindles may also be related to other mental and physical conditions. One area of inquiry is their importance for emotional regulation. Beyond this, it seems increasingly likely that changes in the sleep patterns, more specifically, a decline in frequency and amplitude, are indicative of certain diseases. Spindle activity disruptions have even been identified as biomarkers of not only cognitive decline and Alzheimer's disease, but also neurological conditions like Parkinson's disease.","structure":[[["S","One area of inquiry"],["V","is"],["C","their importance for emotional regulation."]],"emotional","형용사","emotional regulation","Adj+N","감정 조절","of inquiry는 주어 안에 포함합니다. for emotional regulation는 importance를 보충하는 보어 내부 성분입니다."],"writing":["Can you tell me the course registration process?","Sure. Which steps|do you|want me|to explain?",315,67,10]}];

function validProgress(s){

 const task=t=>{
  if(!t||!['structure','classify','map','slot','col','reading','writing'].includes(t.kind))return false;
  if(['structure','classify','map'].includes(t.kind)){
   const s=byId(t.sid);if(!s)return false;if(t.kind==='map')return true;
   const expected=t.kind==='structure'?syntaxQuestions(s):[classifyQuestion(s)].filter(Boolean);
   return expected.some(q=>q.role===t.role&&JSON.stringify(q.ranges)===JSON.stringify(t.ranges));
  }
  if(t.kind==='slot')return SLOTS.some(q=>q.id===t.id)&&[undefined,0,1].includes(t.phase);
  if(t.kind==='col')return COLLOCATIONS.some(q=>q.id===t.id)&&[0,1,2,3].includes(t.phase);
  return (t.kind==='reading'?PARAGRAPHS:WRITING).some(q=>q.id===t.id);
 };

}
async function cloudPayload(){
 const raw=JSON.stringify(store);let record;
 if(typeof CompressionStream==='undefined')throw new Error('이 브라우저는 gzip 압축을 지원하지 않습니다. 압축 없는 클라우드 업로드는 차단했습니다. 최신 브라우저를 사용하세요.');
 {
  const buffer=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
  let binary='';for(const byte of new Uint8Array(buffer))binary+=String.fromCharCode(byte);
  record={app:CLOUD_APP,format:1,savedAt:new Date().toISOString(),encoding:'gzip-base64',data:btoa(binary)};
 }
 lastCloudBytes=new Blob([JSON.stringify(record)]).size;
 if(lastCloudBytes>=100000)throw new Error('압축 후 '+lastCloudBytes.toLocaleString()+'바이트입니다. 100,000바이트 미만만 업로드합니다. 기록을 삭제하지 않았습니다. 파일 백업을 내려받으세요.');
 return record;
}
async function readCloudRecord(record){
 if(record?.app!==CLOUD_APP||record.format!==1)throw new Error('트레이너 전용 백업이 아닙니다. 단어 SRS Bin은 사용할 수 없으며 변경하지 않았습니다.');
 let state=record.state;
 if(record.encoding){
  if(record.encoding!=='gzip-base64'||typeof DecompressionStream==='undefined')throw new Error('이 브라우저는 백업 압축 형식을 지원하지 않습니다. 최신 브라우저를 사용하세요.');
  const bytes=Uint8Array.from(atob(record.data),c=>c.charCodeAt(0));
  state=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
 }
 if(!validProgress(state))throw new Error('학습 기록 형식이나 문제 참조가 올바르지 않습니다. 기존 기록은 유지됩니다.');
 return state;
}

function validCloudUI(session){

 if(u.anchor!==null&&(!Number.isInteger(u.anchor)||u.anchor<0||u.anchor>=1000))return false;
 if(u.feedback&&(!['answer','expected','note'].every(k=>typeof u.feedback[k]==='string')||typeof u.feedback.ok!=='boolean'))return false;
 if(u.locked&&!u.feedback)return false;
 if(u.choices&&(!Array.isArray(u.choices)||!u.choices.every(s=>typeof s==='string')))return false;
 if(t.kind==='writing'){
  const n=WRITING.find(w=>w.id===t.id).chunks.length;
  if(u.order.some(i=>i>=n)||new Set(u.order).size!==u.order.length||!integers(u.pool)||u.pool.length!==n||new Set(u.pool).size!==n||u.pool.some(i=>i>=n))return false;

}
